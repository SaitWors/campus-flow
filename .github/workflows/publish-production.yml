# Publish only after the full CI run on the default branch succeeds.
# This workflow has packages:write, so never use code from unmerged PRs.
name: Publish verified production images

on:
  workflow_run:
    workflows: ["Campus Flow verification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "Publishing $RELEASE_SHA"

      - name: Commit timestamp for build metadata
        id: stamp
        shell: bash
        run: |
          echo "build_date=$(git show -s --format=%cI "$RELEASE_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/saitwors/campus-flow-${{ matrix.component }}:${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          build-args: |
            VCS_REF=${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/SaitWors/campus-flow
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=campus-flow-${{ matrix.component }}
          cache-to: type=gha,scope=campus-flow-${{ matrix.component }},mode=max

      - name: Check published image manifest
        shell: bash
        run: |
          docker buildx imagetools inspect "ghcr.io/saitwors/campus-flow-${{ matrix.component }}:${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}"
