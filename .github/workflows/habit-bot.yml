name: Patchboard reminder bot
on:
  pull_request:
    paths: ['bots/mandarin-habits/**', 'scripts/bot_runner.py', 'tests/test_bot_runner_storage.py', '.github/workflows/habit-bot.yml']
  push:
    branches: [main]
    paths: ['bots/mandarin-habits/**', 'scripts/bot_runner.py', '.github/workflows/habit-bot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PTB_TIMEDELTA: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bots/mandarin-habits/requirements.txt
      - run: python -m pip install -r bots/mandarin-habits/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: bots/mandarin-habits
      - run: python -m compileall -q habitbot bot.py
        working-directory: bots/mandarin-habits
      - run: docker build -t cf-habit-bot:test bots/mandarin-habits
      - run: bash bots/mandarin-habits/scripts/test_image.sh cf-habit-bot:test
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/saitwors/campus-flow-habit-bot
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve published commit tags
        id: existing
        shell: bash
        run: |
          HB_META=$(docker buildx imagetools inspect "$IMAGE:$COMMIT" 2>/dev/null || true)
          HB_DIGEST=$(printf '%s\n' "$HB_META" | awk '$1=="Digest:" {print $2; exit}')
          if [[ "$HB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "digest=$HB_DIGEST" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        if: steps.existing.outputs.digest == ''
        with:
          context: bots/mandarin-habits
          push: true
          tags: ${{ env.IMAGE }}:${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Patchboard Java course and personal habit reminders
          provenance: mode=max
      - name: Image string for the Campus Flow form
        shell: bash
        env:
          HB_DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
        run: |
          [[ "$HB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' 'Paste this full image into Campus Flow - Bots - Application image:' '```text' "$IMAGE@$HB_DIGEST" '```' >> "$GITHUB_STEP_SUMMARY"
