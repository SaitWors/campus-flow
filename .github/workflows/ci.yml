name: Campus Flow verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r services/requirements.lock
      - run: python -m pytest -q -s
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm test && npm run build
        working-directory: apps/web
  compose:
    env:
      COMPOSE_PROFILES: translation
      TRANSLATION_WORKER: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash scripts/start.sh
      - run: pip install httpx==0.28.1
      - name: Real PostgreSQL and gateway workflow
        run: python scripts/smoke.py --base-url http://localhost:8080 --allow-empty-instance
      - name: Notification integration workflow
        run: python -m scripts.verify_notifications
      - name: Guest, dual roles and private question workflow
        run: python -m scripts.verify_community
      - name: Real offline Russian to English translation
        run: python -m scripts.verify_translation
      - name: Verify API schemas and private route boundary
        run: |
          curl --fail http://localhost:8080/api/auth/openapi.json -o /tmp/auth-schema.json
          curl --fail http://localhost:8080/api/schedule/openapi.json -o /tmp/schedule-schema.json
          curl --fail http://localhost:8080/api/queues/openapi.json -o /tmp/queue-schema.json
          curl --fail http://localhost:8080/api/notifications/openapi.json -o /tmp/notifications-schema.json
          test -z "$(docker compose port translator 5000 2>/dev/null || true)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/internal/events)" = 404
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser for visual checks
        run: |
          npm install --prefix /tmp/campus-browser --no-audit --no-fund playwright@1.58.2
          /tmp/campus-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser checks
        env:
          NODE_PATH: /tmp/campus-browser/node_modules
        run: |
          node scripts/check_ui.cjs
          node scripts/check_notifications_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-flow-ui
          path: test-results/
          if-no-files-found: ignore
      - name: Backup and restore round trip
        run: |
          bash scripts/backup.sh
          restore_dirs=(backups/*/)
          printf 'RESTORE\n' | bash scripts/restore.sh "${restore_dirs[0]}"
          python scripts/verify_restore.py
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Teardown ephemeral CI data
        if: always()
        run: docker compose down --volumes
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Default launch does not build or start a language model
        run: |
          bash scripts/start.sh
          test -z "$(docker compose --profile translation ps -q translator)"
          docker compose exec -T notifications python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200"
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke.py --base-url http://localhost:8080 --allow-empty-instance
      - run: python -m scripts.verify_notifications
      - run: python -m scripts.verify_community
      - name: Lightweight translation fallback
        run: |
          python - <<'PY'
          import httpx
          with httpx.Client(base_url='http://localhost:8080',trust_env=False) as c:
              s=c.post('/api/auth/login',json={'email':'admin@example.test','password':'Integration-test-password-2026'}).json()
              r=c.post('/api/schedule/title-preview',json={'title':'Технологии баз данных'},headers={'X-CSRF-Token':s['csrf']})
              assert r.status_code==200 and r.json()['translation_enabled'] is False
              assert r.json()['translation_pending'] is False
          print('PASS: default stack without translator, all four APIs and explicit manual-translation fallback')
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Teardown disposable data
        if: always()
        run: docker compose down --volumes
