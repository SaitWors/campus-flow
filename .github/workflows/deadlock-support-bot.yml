name: Deadlock Contracts support bot
on:
  pull_request:
    paths: ['bots/deadlock-support/**', '.github/workflows/deadlock-support-bot.yml']
  push:
    branches: [main, feat/deadlock-support-bot]
    paths: ['bots/deadlock-support/**', '.github/workflows/deadlock-support-bot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -v
        working-directory: bots/deadlock-support
      - name: Verify image under the Bot Runner storage and permission model
        shell: bash
        run: |
          docker build --tag deadlock-support:test bots/deadlock-support
          docker run --rm --read-only --user 10001:10001 --cap-drop ALL --network none \
            --volume /data --entrypoint python deadlock-support:test -c \
            'import os, bot; from faq import ARTICLES; from store import Store; assert os.getuid() == 10001; assert ARTICLES; store = Store("/data/support.sqlite3"); store.bind_bot(1); assert store.owner_id() is None; store.close()'
  publish:
    needs: verify
    if: >-
      github.repository == 'SaitWors/campus-flow' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/deadlock-support-bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/saitwors/campus-flow-deadlock-support
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: bots/deadlock-support
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Print the image reference for Campus Flow
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' 'Campus Flow → Боты → Образ приложения' '~~~text' \
            "$IMAGE@$IMAGE_DIGEST" '~~~' >> "$GITHUB_STEP_SUMMARY"
