map $uri $campus_cache_control {
    default "";
    /index.html "no-store";
    /version.json "no-store";
}

# Server rewrites run before the normal 64 KiB body-size check. Only this
# exact method/path reaches the private upload location with its larger limit.
map "$request_method:$uri" $campus_material_upload {
    default 0;
    "~^POST:/api/schedule/subjects/[a-f0-9]{64}/materials$" 1;
}

log_format campus_json escape=json '{"time":"$time_iso8601","service":"gateway","request_id":"$request_id","method":"$request_method","status":$status,"duration_s":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout campus_json;
    client_max_body_size 64k;
    large_client_header_buffers 2 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_backend http://auth:8000;
    set $schedule_backend http://schedule:8000;
    set $notifications_backend http://notifications:8000;
    if ($campus_material_upload) {
        rewrite ^ /_campus-material-upload$uri last;
    }
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Only the dedicated public timetable is available offline. Do not let
    # the browser's memory cache bypass the worker with an old app shell.
    add_header Cache-Control $campus_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /sw.js { expires -1; try_files $uri =404; }
    # Only trusted static assets from the Campus Flow web image are served as
    # HTML. Bot containers expose JSON, never scripts or same-origin HTML.
    location ~ "^/habits/(?<hb_id>[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/api/(?<hb_api>state|action|lesson/[0-9]{1,2})$" {
        set $habits_backend http://cfbot-$hb_id:8081;
        client_max_body_size 32k;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Token "";
        proxy_set_header Host $host;
        # Bot responses remain untrusted data even for opted-in images.
        proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Expires Cache-Control Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Location;
        proxy_hide_header Refresh;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header WWW-Authenticate;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        proxy_pass $habits_backend/api/$hb_api$is_args$args;
    }
    location ~ "^/habits/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/$" {
        rewrite ^ /habits-app/index.html last;
    }
    location /habits/ { return 404; }
    location /habits-app/ {
        try_files $uri =404;
        include /etc/nginx/habits-headers.conf;
    }
    location = /manifest.webmanifest { expires -1; default_type application/manifest+json; try_files $uri =404; }
    location = /api/notifications/openapi.json { proxy_pass $notifications_backend/openapi.json; }
    location /api/notifications/ { proxy_pass $notifications_backend; }
    location = /health { access_log off; return 200 'ok'; }
    location = /version { default_type application/json; try_files /version.json =404; }
    location = /api/auth/version { proxy_pass $auth_backend/version; }
    location = /api/schedule/version { proxy_pass $schedule_backend/version; }
    location = /api/notifications/version { proxy_pass $notifications_backend/version; }
    location = /api/auth/openapi.json { proxy_pass $auth_backend/openapi.json; }
    location = /api/schedule/openapi.json { proxy_pass $schedule_backend/openapi.json; }
    location /api/auth/ { proxy_pass $auth_backend$request_uri; }
    location ~ "^/_campus-material-upload/api/schedule/subjects/[a-f0-9]{64}/materials$" {
        internal;
        client_max_body_size 50m;
        client_body_timeout 300s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass $schedule_backend$request_uri;
    }
    location /api/schedule/ { proxy_pass $schedule_backend$request_uri; }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
