map $uri $campus_cache_control {
    default "";
    /index.html "no-store";
    /version.json "no-store";
}

log_format campus_json escape=json '{"time":"$time_iso8601","service":"gateway","request_id":"$request_id","method":"$request_method","status":$status,"duration_s":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout campus_json;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_backend http://auth:8000;
    set $schedule_backend http://schedule:8000;
    set $queue_backend http://queue:8000;
    set $notifications_backend http://notifications:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Only the dedicated public timetable is available offline. Do not let
    # the browser's memory cache bypass the worker with an old app shell.
    add_header Cache-Control $campus_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { expires -1; default_type application/manifest+json; try_files $uri =404; }
    location = /api/notifications/openapi.json { proxy_pass $notifications_backend/openapi.json; }
    location /api/notifications/ { proxy_pass $notifications_backend; }
    location = /health { access_log off; return 200 'ok'; }
    location = /version { default_type application/json; try_files /version.json =404; }
    location = /api/auth/version { proxy_pass $auth_backend/version; }
    location = /api/schedule/version { proxy_pass $schedule_backend/version; }
    location = /api/queues/version { proxy_pass $queue_backend/version; }
    location = /api/notifications/version { proxy_pass $notifications_backend/version; }
    location = /api/auth/openapi.json { proxy_pass $auth_backend/openapi.json; }
    location = /api/schedule/openapi.json { proxy_pass $schedule_backend/openapi.json; }
    location = /api/queues/openapi.json { proxy_pass $queue_backend/openapi.json; }
    location /api/auth/ { proxy_pass $auth_backend$request_uri; }
    location /api/schedule/ { proxy_pass $schedule_backend$request_uri; }
    location = /api/queues { proxy_pass $queue_backend$request_uri; }
    location /api/queues/ { proxy_pass $queue_backend$request_uri; }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
